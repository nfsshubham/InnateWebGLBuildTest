<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Sandpaper Numbers</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=no"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        background-color: "white";
        background-size: cover;
        font-family: Arial, sans-serif;
      }

      /* 772 width. 435
      392 height. 697 */

      #unity-container {
        position: relative;
        width: 100%;
        height: 100vh;
        /* width: 435px;
        height: 697px; */
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }

      #unity-canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        /* background: transparent; */
        background-color: "white";
      }

      /* Default desktop styling */
      @media screen and (min-width: 1024px) {
        #unity-canvas {
          width: 100%;
          height: 100%;
          max-width: none;
          max-height: none;
        }
      }

      /* Tablet styling */
      @media screen and (min-width: 768px) and (max-width: 1023px) {
        #unity-canvas {
          width: 100vw;
          height: 56.25vw; /* 16:9 aspect ratio */
          max-height: 100vh;
        }

        /* If height would be too large, fit by height instead */
        @media screen and (min-width: 768px) and (max-width: 1023px) and (min-aspect-ratio: 16/9) {
          #unity-canvas {
            width: 177.78vh; /* 16:9 aspect ratio */
            height: 100vh;
            max-width: 100vw;
          }
        }
      }

      /* Mobile styling - Fill entire screen */
      @media screen and (max-width: 767px) {
        html,
        body {
          height: 100vh;
          height: -webkit-fill-available;
        }

        #unity-container {
          height: 100vh;
          height: -webkit-fill-available;
          background: transparent;
        }

        #unity-canvas {
          width: 100vw !important;
          height: 100vh !important;
          height: -webkit-fill-available !important;
          max-width: none !important;
          max-height: none !important;
          object-fit: cover;
        }
      }

      /* Loading indicator */
      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 18px;
        z-index: 1000;
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <div id="loading">Loading...</div>
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <script src="Build/SandPaperNumbers.loader.js"></script>
    <script>

        // Your code to add event listeners here

          document.documentElement.style.setProperty("--vh", `${vh}px`);
        }

        setViewportHeight();

        // Update on resize and orientation change
        window.addEventListener("resize", setViewportHeight);
        window.addEventListener("orientationchange", () => {
          setTimeout(setViewportHeight, 100);

    </script>
  </body>
</html>
